# Bootstrap server block — HTTP only.
#
# Use this for the very first nginx reload, before any certificate exists.
# nginx refuses to start if an `ssl_certificate` path is missing, so the full
# TLS config in nginx.conf cannot be installed until certbot has issued one.
#
# Order: install this -> run certbot -> replace with nginx.conf.

server {
    listen 80;
    listen [::]:80;
    server_name docs.gatahub.zone;

    # certbot --webroot writes its challenge files here. Same webroot the apex
    # gatahub.zone config already uses.
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/html;
        default_type "text/plain";
        try_files    $uri =404;
    }

    location / {
        return 200 'docs.gatahub.zone: awaiting certificate\n';
        add_header Content-Type text/plain;
    }
}
