# ─────────────────────────────────────────────────────────────────────────
#  docs.gatahub.zone — nginx server block
#
#  Static build, no Node process in production. nginx serves
#  /var/www/gata-docs/current, a symlink that deploy.sh re-points atomically.
#
#  Check with:
#    nginx -t
#    curl -sI https://docs.gatahub.zone | head -1
#    curl -s -o /dev/null -w '%{http_code}\n' https://docs.gatahub.zone/g/gata-hub
#  The last one must be 301 — it is the old GitBook URL space.
# ─────────────────────────────────────────────────────────────────────────

# The site is fully self-contained: fonts, images and scripts are all local,
# and there are no iframes or third-party subresources. So this can stay
# same-origin throughout. 'unsafe-inline' covers Starlight's inline theme
# script and inline styles; 'wasm-unsafe-eval' is required by Pagefind, which
# runs the search index as WebAssembly.
map $host $docs_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'";
}

# No includeSubDomains, matching the apex config — it would force HTTPS on
# every *.gatahub.zone host, including ones not yet holding a certificate.
map $host $docs_hsts {
    default "max-age=31536000";
}

server {
    # http2 on the listen line: the separate `http2 on;` directive only exists
    # from nginx 1.25.1, and this box runs 1.24.0.
    listen              443 ssl http2;
    listen              [::]:443 ssl http2;
    server_name         docs.gatahub.zone;

    ssl_certificate     /etc/letsencrypt/live/gata-docs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gata-docs/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # `current` is a symlink deploy.sh re-points. Without disable_symlinks off
    # nginx caches the resolved target and keeps serving the previous release.
    root                /var/www/gata-docs/current;
    index               index.html;
    disable_symlinks    off;

    # ── compression ─────────────────────────────────────────────────────
    gzip                on;
    gzip_vary           on;
    gzip_min_length     1024;
    gzip_types          text/html text/css application/javascript application/json image/svg+xml;

    # NOTE: nginx's add_header does not merge across levels — a location that
    # sets any add_header of its own discards every header inherited from the
    # server block. The security headers are therefore repeated in each
    # location below, or they silently vanish from those responses.

    # ── build output ────────────────────────────────────────────────────
    # Fingerprinted by Astro, so the filename changes whenever the content
    # does. Safe to pin hard.
    location /_astro/ {
        access_log  off;
        add_header  Cache-Control              "public, max-age=31536000, immutable";
        add_header  Content-Security-Policy    $docs_csp  always;
        add_header  Strict-Transport-Security  $docs_hsts always;
        add_header  X-Content-Type-Options     "nosniff"  always;
        add_header  Referrer-Policy            "strict-origin-when-cross-origin" always;
        try_files   $uri =404;
    }

    location /fonts/ {
        access_log  off;
        add_header  Cache-Control              "public, max-age=31536000, immutable";
        add_header  Content-Security-Policy    $docs_csp  always;
        add_header  Strict-Transport-Security  $docs_hsts always;
        add_header  X-Content-Type-Options     "nosniff"  always;
        add_header  Referrer-Policy            "strict-origin-when-cross-origin" always;
        types       { font/woff2 woff2; }
        default_type font/woff2;
        try_files   $uri =404;
    }

    # Images keep their filenames across builds, so these get a fixed window
    # rather than immutable.
    location /files/ {
        access_log  off;
        add_header  Cache-Control              "public, max-age=2592000";
        add_header  Content-Security-Policy    $docs_csp  always;
        add_header  Strict-Transport-Security  $docs_hsts always;
        add_header  X-Content-Type-Options     "nosniff"  always;
        add_header  Referrer-Policy            "strict-origin-when-cross-origin" always;
        try_files   $uri =404;
    }

    # The search index is rewritten every build under the same names, so it
    # has to be revalidated or search silently returns stale results.
    location /pagefind/ {
        add_header  Cache-Control              "public, max-age=300, must-revalidate";
        add_header  Content-Security-Policy    $docs_csp  always;
        add_header  Strict-Transport-Security  $docs_hsts always;
        add_header  X-Content-Type-Options     "nosniff"  always;
        add_header  Referrer-Policy            "strict-origin-when-cross-origin" always;
        try_files   $uri =404;
    }

    # ── hygiene ─────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    # ── pages ───────────────────────────────────────────────────────────
    # Astro emits directory-style routes (/nfts/yield-paws/index.html). HTML
    # must never be cached: a stale page would point at fingerprinted assets
    # that no longer exist after a deploy.
    location / {
        add_header  Cache-Control              "no-cache";
        add_header  Content-Security-Policy    $docs_csp  always;
        add_header  Strict-Transport-Security  $docs_hsts always;
        add_header  X-Content-Type-Options     "nosniff"  always;
        add_header  Referrer-Policy            "strict-origin-when-cross-origin" always;
        try_files   $uri $uri/ $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    access_log /var/log/nginx/gata-docs.access.log;
    error_log  /var/log/nginx/gata-docs.error.log;
}

# ── plain http -> https ──────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name docs.gatahub.zone;

    # Let certbot answer HTTP-01 challenges. Without this the redirect below
    # swallows the challenge and renewal fails quietly, sixty days from now.
    # Same webroot the apex config uses.
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/html;
        default_type "text/plain";
        try_files    $uri =404;
    }

    location / {
        return 301 https://docs.gatahub.zone$request_uri;
    }
}
