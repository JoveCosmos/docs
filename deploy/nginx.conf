# nginx server block for docs.gatahub.zone
#
# Serves the static build from the `current` symlink that deploy.sh flips.
# Certificates assumed to come from certbot; adjust paths to match your setup.

server {
    listen 80;
    listen [::]:80;
    server_name docs.gatahub.zone;

    # keep the ACME path on HTTP so renewals work without following redirects
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.gatahub.zone;

    ssl_certificate     /etc/letsencrypt/live/docs.gatahub.zone/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.gatahub.zone/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # `current` is a symlink that deploy.sh re-points; nginx must not cache the
    # resolved path or it keeps serving the previous release
    root /srv/gata-docs/current;
    disable_symlinks off;
    index index.html;

    # Astro emits directory-style routes (/nfts/yield-paws/index.html)
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    # fingerprinted build output and images never change under the same name
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /files/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # the search index is regenerated every build, so revalidate it
    location /pagefind/ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    access_log /var/log/nginx/gata-docs.access.log;
    error_log  /var/log/nginx/gata-docs.error.log;
}
